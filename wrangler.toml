name = "appli-bmvr-relais"
main = "worker/src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Adresse de l'appli sur GitHub Pages (sans barre finale), à adapter.
ALLOWED_ORIGIN = "https://toolsmaker2099.github.io"

# Exécute le relais près du portail de la BMVR : chaque lecture enchaîne 3 à 4 appels vers lui, donc la distance compte.
[placement]
mode = "smart"

# --- Notifications téléphone (optionnelles) ---
# Passage horaire ; chaque abonné n'est interrogé que toutes les 3 heures environ (variable NOTIF_EVERY_MIN, en minutes) et jamais entre 22 h et 7 h.
# Sans effet tant que le stockage et les secrets ci-dessous ne sont pas configurés.
[triggers]
crons = ["5 * * * *"]

# Espace de stockage KV « bmvr-notifs » (Cloudflare → Storage & Databases → KV).
[[kv_namespaces]]
binding = "NOTIF"
id = "682203f4de21416caf51b772156d642d"
